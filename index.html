<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Star Clinic - Coming Soon</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 500px;
        }
        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }
        h2 {
            font-weight: normal;
            margin-bottom: 20px;
        }
        p {
            font-size: 16px;
            margin-bottom: 30px;
        }
        .email-box {
            display: flex;
            justify-content: center;
        }
        input[type="email"] {
            padding: 10px;
            border: none;
            border-radius: 5px 0 0 5px;
            outline: none;
            width: 70%;
        }
        button {
            padding: 10px 15px;
            border: none;
            background: #fff;
            color: #27ae60;
            border-radius: 0 5px 5px 0;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #f1f1f1;
        }
        footer {
            margin-top: 20px;
            font-size: 12px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Green Star Clinic</h1>
    <h2>🌿 Coming Soon</h2>
    <p>We are working hard to bring you quality healthcare services. Stay tuned!</p>

    <div class="email-box">
        <input type="email" placeholder="Enter your email">
        <button>Notify Me</button>
    </div>

    <footer>
        © 2026 Green Star Clinic. All rights reserved.
    </footer>
</div>

</body>
</html>
