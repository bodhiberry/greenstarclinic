<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us | Greenstar Clinic & Diagnostic Center</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        :root {
            --primary-green: #2d6a4f;
            --secondary-blue: #0077b6;
            --accent-green: #95d5b2;
            --light-bg: #f0f9ff;
            --text-dark: #1b4332;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            color: var(--text-dark);
            background-color: var(--light-bg);
            overflow-x: hidden;
        }

        h1, h2, h3 { font-family: 'Poppins', sans-serif; }

        /* --- Header & Navigation --- */
        header {
            background-color: var(--white);
            padding: 0.8rem 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 1001;
        }

        .clinic-logo {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }

        .brand-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary-green);
        }

        /* Mobile Menu Toggle */
        .menu-toggle {
            display: none;
            font-size: 1.5rem;
            color: var(--primary-green);
            cursor: pointer;
            z-index: 1001;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        nav ul li a {
            text-decoration: none;
            color: var(--secondary-blue);
            font-weight: 600;
            font-size: 0.95rem;
            transition: 0.3s;
        }

        nav ul li a:hover { color: var(--primary-green); }

        /* --- Page Header --- */
        .page-title-area {
            background: linear-gradient(135deg, var(--primary-green) 0%, var(--secondary-blue) 100%);
            padding: 80px 6%;
            color: white;
            text-align: center;
        }

        .page-title-area h1 { font-size: 2.8rem; letter-spacing: -1px; }

        /* --- Content Layout --- */
        .main-container {
            max-width: 1100px;
            margin: -40px auto 60px;
            padding: 0 6%;
            position: relative;
            z-index: 10;
        }

        .card {
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
            margin-bottom: 40px;
        }

        .card h2 {
            color: var(--primary-green);
            margin-bottom: 25px;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .card p {
            margin-bottom: 20px;
            font-size: 1.05rem;
            color: #444;
            text-align: justify;
        }

        /* --- Quote Styling --- */
        .message-box {
            border-top: 8px solid var(--accent-green);
        }

        .quote-icon {
            font-size: 3rem;
            color: var(--accent-green);
            opacity: 0.3;
            margin-bottom: -20px;
        }

        .signature {
            margin-top: 40px;
            padding-top: 25px;
            border-top: 1px solid #eee;
        }

        .signature strong {
            display: block;
            color: var(--primary-green);
            font-size: 1.3rem;
