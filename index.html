<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greenstar Clinic & Diagnostic Center | Excellence in Diagnostics</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        :root {
            --primary-green: #2d6a4f;
            --secondary-blue: #0077b6;
            --accent-green: #95d5b2;
            --light-bg: #f0f9ff;
            --text-dark: #1b4332;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.7;
            color: var(--text-dark);
            background-color: var(--light-bg);
            overflow-x: hidden;
        }

        h1, h2, h3 { font-family: 'Poppins', sans-serif; }

        /* --- Updated Header & Navigation --- */
        header {
            background-color: var(--white);
            padding: 1rem 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 15px; /* Space between logo and text */
        }

        .clinic-logo {
            width: 60px; /* Slightly larger for visibility */
            height: 60px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .brand-name {
            font-size: 1.4rem; /* Full name size */
            font-weight: 700;
            color: var(--primary-green);
            line-height: 1.2;
            white-space: nowrap; /* Keeps name on one line for desktop */
        }

        .brand-slogan {
            font-size: 0.75rem;
            color: var(--secondary-blue);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        nav ul li a {
            text-decoration: none;
            color: var(--secondary-blue);
            font-weight: 600;
            font-size: 0.95rem;
            transition: 0.3s;
        }

        nav ul li a:hover { color: var(--primary-green); }

        /* --- Rest of Styles (Hero, Footer, etc.) --- */
        .welcome-hero {
            background: linear-gradient(rgba(45, 106, 79, 0.85), rgba(0, 119, 182, 0.85));
            padding: 100px 6%;
            color: white;
            text-align: center;
        }

        #mobile-menu { display: none; cursor: pointer; font-size: 1.5rem; color: var(--primary-green); }

        @media (max-width: 992px) {
            .brand-name { font-size: 1.1rem; white-space: normal; } /* Wrap name on tablets */
        }

        @media (max-width: 768px) {
            header { padding: 1rem 4%; }
            #mobile-menu { display: block; }
            nav ul {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 100%; left: 0; width: 100%;
                background: white;
                padding: 20px;
                box-shadow: 0 10px 10px rgba(0,0,0,0.1);
            }
            nav ul.active { display: flex; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-container">
            <img src="logo.jpg" alt="Greenstar Logo" class="clinic-logo">
            <div class="brand-text">
                <span class="brand-name">Greenstar Clinic & Diagnostic Center</span>
                <span class="brand-slogan">Excellence in Diagnostics</span>
            </div>
        </div>
        
        <div id="mobile-menu"><i class="fas fa-bars"></i></div>
        
        <nav>
            <ul id="nav-list">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="welcome-hero">
        <div class="hero-content">
            <h1>Leading Diagnostic Excellence in Nepal</h1>
            <p>Trusted Technology. Accurate Results.</p>
        </div>
    </section>

    <script>
        const menuToggle = document.getElementById('mobile-menu');
        const navList = document.getElementById('nav-list');

        menuToggle.addEventListener('click', () => {
            navList.classList.toggle('active');
            const icon = menuToggle.querySelector('i');
            icon.classList.toggle('fa-bars');
            icon.classList.toggle('fa-times');
        });
    </script>
</body>
</html>
